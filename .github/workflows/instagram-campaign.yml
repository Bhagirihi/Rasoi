# Fires daily at 7:00 PM IST (13:30 UTC) to publish the next due Rasoi ad post.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   INSTAGRAM_USERNAME
#   INSTAGRAM_PASSWORD

name: Instagram campaign

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-campaign
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish due campaign post
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: |
          if [ -z "$INSTAGRAM_USERNAME" ] || [ -z "$INSTAGRAM_PASSWORD" ]; then
            echo "Missing INSTAGRAM_USERNAME or INSTAGRAM_PASSWORD repository secret."
            exit 1
          fi
          cd .cursor/mcp-servers/instagram
          pip install -q -r requirements.txt
          python server.py --run-due --max-posts=1
