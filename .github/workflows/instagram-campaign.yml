# Fires daily at 10:00 AM IST (04:30 UTC) to publish the next due Rasoi ad post.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   INSTAGRAM_USERNAME
#   INSTAGRAM_PASSWORD
#   INSTAGRAM_SESSION_JSON  (base64 instagram_session.json — run export-instagram-session.sh)

name: Instagram campaign

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-campaign
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish due campaign post
        id: publish
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
        run: |
          if [ -z "$INSTAGRAM_USERNAME" ] || [ -z "$INSTAGRAM_PASSWORD" ]; then
            echo "Missing INSTAGRAM_USERNAME or INSTAGRAM_PASSWORD repository secret."
            exit 1
          fi
          if [ -z "$INSTAGRAM_SESSION_JSON" ]; then
            echo "Missing INSTAGRAM_SESSION_JSON repository secret."
            echo "Run locally: .cursor/mcp-servers/instagram/export-instagram-session.sh"
            exit 1
          fi
          cd .cursor/mcp-servers/instagram
          echo "$INSTAGRAM_SESSION_JSON" | tr -d '\n' | base64 -d > instagram_session.json
          if [ ! -s instagram_session.json ]; then
            echo "Failed to decode INSTAGRAM_SESSION_JSON into instagram_session.json"
            exit 1
          fi
          pip install -q -r requirements.txt
          python3 server.py --run-due --max-posts=1

      - name: Commit publish state
        if: success()
        run: |
          if git diff --quiet -- .cursor/mcp-servers/instagram/schedule-state.json; then
            echo "No schedule-state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cursor/mcp-servers/instagram/schedule-state.json
          git commit -m "chore(instagram): record published campaign post [skip ci]"
          git push
