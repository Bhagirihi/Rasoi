name: Validate Play manifest

on:
  push:
    paths:
      - 'rasoi_mobile/store/play-console/manifest.json'
      - 'rasoi_mobile/store/play-console/manifest.schema.json'
      - 'rasoi_mobile/scripts/validate-play-manifest.mjs'
      - 'rasoi_mobile/package.json'
      - 'rasoi_mobile/package-lock.json'
      - '.github/workflows/validate-play-manifest.yml'
  pull_request:
    paths:
      - 'rasoi_mobile/store/play-console/manifest.json'
      - 'rasoi_mobile/store/play-console/manifest.schema.json'
      - 'rasoi_mobile/scripts/validate-play-manifest.mjs'
      - 'rasoi_mobile/package.json'
      - 'rasoi_mobile/package-lock.json'
      - '.github/workflows/validate-play-manifest.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rasoi_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rasoi_mobile/package-lock.json
      - run: npm ci
      - run: npm run validate:play-manifest
