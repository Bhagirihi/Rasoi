# Reach login screen after fresh install (login-first; clears stale onboarding/pantry if needed).
appId: com.bhagihiri.rasoiapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    notVisible:
      text: "Opening Rasoi"
    timeout: 240000
    optional: true
- runFlow:
    when:
      visible:
        id: onboarding-skip-notify
    commands:
      - tapOn:
          id: onboarding-skip-notify
- runFlow:
    when:
      visible:
        id: onboarding-skip-location
    commands:
      - tapOn:
          id: onboarding-skip-location
- runFlow:
    file: _dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: onboarding-diet-veg
    commands:
      - runFlow:
          file: _onboarding.yaml
- runFlow:
    when:
      visible:
        id: screen-trial-welcome
    commands:
      - tapOn:
          id: trial-continue
- runFlow:
    when:
      visible:
        id: screen-pantry
    commands:
      - runFlow:
          file: _skip-pantry-setup.yaml
- extendedWaitUntil:
    visible:
      id: screen-login
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: screen-home
    commands:
      - tapOn:
          id: tab-settings
      - runFlow:
          when:
            visible:
              id: settings-logout
          commands:
            - scrollUntilVisible:
                element:
                  id: settings-logout
                direction: DOWN
                timeout: 30000
            - tapOn:
                id: settings-logout
            - extendedWaitUntil:
                visible:
                  text: "Log out?"
                timeout: 10000
            - tapOn:
                id: settings-logout-confirm
      - runFlow:
          when:
            notVisible:
              id: settings-logout
          commands:
            - scrollUntilVisible:
                element:
                  text: "Reset full flow (testing)"
                direction: DOWN
                timeout: 30000
            - tapOn:
                text: "Reset full flow (testing)"
            - extendedWaitUntil:
                visible:
                  text: "Reset everything?"
                timeout: 10000
            - tapOn:
                text: "Reset"
- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 240000
- assertVisible:
    id: screen-login
