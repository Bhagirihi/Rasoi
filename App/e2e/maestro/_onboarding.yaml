# Complete onboarding when shown.
appId: com.bhagihiri.rasoiapp
---
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible:
        id: screen-onboarding
    commands:
      - tapOn:
          id: onboarding-diet-veg
      - scrollUntilVisible:
          element:
            id: onboarding-cuisine-first
          direction: DOWN
          timeout: 60000
      - runFlow:
          when:
            visible:
              id: onboarding-cuisine-first
          commands:
            - tapOn:
                id: onboarding-cuisine-first
      - runFlow:
          when:
            notVisible:
              id: onboarding-cuisine-first
          commands:
            - scrollUntilVisible:
                element:
                  text: "Gujarati"
                direction: DOWN
                timeout: 30000
            - tapOn:
                text: "Gujarati"
      - extendedWaitUntil:
          notVisible:
            text: "Pick at least one kitchen style"
          timeout: 15000
      - tapOn:
          id: onboarding-diet-continue
      - extendedWaitUntil:
          visible:
            id: onboarding-skip-notify
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible:
              id: onboarding-skip-notify
          commands:
            - tapOn:
                id: onboarding-skip-notify
      - extendedWaitUntil:
          visible:
            id: onboarding-skip-location
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible:
              id: onboarding-skip-location
          commands:
            - tapOn:
                id: onboarding-skip-location
      - runFlow:
          file: _dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: screen-trial-welcome
    commands:
      - tapOn:
          id: trial-continue
- runFlow:
    file: _dismiss-permissions.yaml
- runFlow:
    file: _skip-pantry-setup.yaml
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
    optional: true
