# TC-010: Saved tab
appId: com.bhagihiri.rasoiapp
---
- extendedWaitUntil:
    visible:
      id: screen-saved
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible:
        id: screen-saved
    commands:
      - tapOn:
          id: tab-saved
- assertVisible:
    id: screen-saved
