# Fresh install: auto guest bootstrap → onboarding or home (no legal consent gate)
appId: com.bhagihiri.rasoiapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 60000
- runFlow:
    file: _onboarding.yaml
- runFlow:
    file: _dismiss-permissions.yaml
