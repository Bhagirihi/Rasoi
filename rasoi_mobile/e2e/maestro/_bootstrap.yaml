# Fresh install: legal consent → guest home (no login wall)
appId: com.bhagihiri.rasoiapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: legal-consent-checkbox
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: legal-consent-checkbox
- tapOn:
    id: legal-consent-continue
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
- runFlow:
    file: _dismiss-permissions.yaml
