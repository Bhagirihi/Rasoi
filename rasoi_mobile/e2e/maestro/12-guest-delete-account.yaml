# TC-023: Guest session — delete account from Settings
appId: com.bhagihiri.rasoiapp
---
- runFlow:
    file: 01-guest-smoke.yaml
- tapOn:
    id: tab-settings
- assertVisible:
    id: screen-settings
- scrollUntilVisible:
    id: settings-delete-account
    direction: DOWN
    timeout: 30000
- tapOn:
    id: settings-delete-account
- extendedWaitUntil:
    visible:
      id: delete-reason-modal
    timeout: 10000
- tapOn:
    id: delete-reason-option-not_using
- tapOn:
    id: delete-reason-continue
- extendedWaitUntil:
    visible:
      text: "Delete guest session?"
    timeout: 10000
- tapOn:
    id: settings-delete-confirm
- extendedWaitUntil:
    visible:
      id: screen-login
    timeout: 45000
- assertVisible:
    id: screen-login
