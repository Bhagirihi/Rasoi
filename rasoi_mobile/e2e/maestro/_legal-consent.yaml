# Accept Terms & Privacy — auto-guest lands on Home.
appId: com.bhagihiri.rasoiapp
---
- extendedWaitUntil:
    visible:
      id: screen-legal-consent
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: legal-consent-checkbox
    timeout: 15000
- tapOn:
    id: legal-consent-checkbox
- tapOn:
    id: legal-consent-continue
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
- runFlow:
    file: _dismiss-permissions.yaml
