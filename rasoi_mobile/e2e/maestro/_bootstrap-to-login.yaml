# Reach login screen after fresh install (handles auto-guest, permissions, or direct login).
appId: com.bhagihiri.rasoiapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    when:
      visible:
        id: onboarding-skip-notify
    commands:
      - tapOn:
          id: onboarding-skip-notify
- runFlow:
    when:
      visible:
        id: onboarding-skip-location
    commands:
      - tapOn:
          id: onboarding-skip-location
- runFlow:
    file: _dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: onboarding-diet-veg
    commands:
      - runFlow:
          file: _onboarding.yaml
- runFlow:
    when:
      visible:
        id: screen-trial-welcome
    commands:
      - tapOn:
          id: trial-continue
- runFlow:
    when:
      visible:
        id: pantry-setup-skip
    commands:
      - tapOn:
          id: pantry-setup-skip
- extendedWaitUntil:
    visible:
      id: screen-login
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: screen-home
    commands:
      - tapOn:
          id: tab-settings
      - runFlow:
          when:
            visible:
              id: settings-logout
          commands:
            - scrollUntilVisible:
                element:
                  id: settings-logout
                direction: DOWN
                timeout: 30000
            - tapOn:
                id: settings-logout
            - extendedWaitUntil:
                visible:
                  text: "Log out?"
                timeout: 10000
            - tapOn:
                id: settings-logout-confirm
      - runFlow:
          when:
            notVisible:
              id: settings-logout
          commands:
            - scrollUntilVisible:
                element:
                  text: "Reset full flow (testing)"
                direction: DOWN
                timeout: 30000
            - tapOn:
                text: "Reset full flow (testing)"
            - extendedWaitUntil:
                visible:
                  text: "Reset everything?"
                timeout: 10000
            - tapOn:
                text: "Reset"
- extendedWaitUntil:
    visible:
      id: screen-login
    timeout: 120000
