# Clear post-auth gates (legal, onboarding, trial, pantry, permissions) until home.
appId: com.bhagihiri.rasoiapp
---
- extendedWaitUntil:
    visible:
      id: screen-legal-consent
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        id: screen-legal-consent
    commands:
      - runFlow:
          file: _legal-consent.yaml
- runFlow:
    file: _onboarding.yaml
- runFlow:
    when:
      visible:
        id: onboarding-skip-notify
    commands:
      - tapOn:
          id: onboarding-skip-notify
- runFlow:
    when:
      visible:
        id: onboarding-skip-location
    commands:
      - tapOn:
          id: onboarding-skip-location
- runFlow:
    file: _dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: screen-trial-welcome
    commands:
      - tapOn:
          id: trial-continue
- extendedWaitUntil:
    visible:
      id: pantry-setup-skip
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        id: pantry-setup-skip
    commands:
      - tapOn:
          id: pantry-setup-skip
- runFlow:
    when:
      visible:
        id: screen-pantry
    commands:
      - tapOn:
          id: tab-home
- runFlow:
    file: _dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 120000
