# TC-015: Login — verify OTP and reach home (continues session after 10-login-send-otp)
# Env: QA_OTP
appId: com.bhagihiri.rasoiapp
---
- extendedWaitUntil:
    visible:
      text: "Check your email"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: login-otp-input
    commands:
      - tapOn:
          id: login-otp-input
      - eraseText
      - inputText: ${QA_OTP}
- runFlow:
    when:
      notVisible:
        id: login-otp-input
    commands:
      - tapOn: "123456"
      - eraseText
      - inputText: ${QA_OTP}
- hideKeyboard
- tapOn:
    text: "Sign in"
- runFlow:
    file: _reach-home.yaml
- assertVisible:
    id: screen-home
