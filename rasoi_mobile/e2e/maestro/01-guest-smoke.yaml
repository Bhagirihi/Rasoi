# Guest smoke — current: legal → login → guest → onboarding → trial → tabs.
# Legacy APK (onboarding-first) falls back to register guest after onboarding.
appId: com.bhagihiri.rasoiapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    file: _dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: screen-legal-consent
    commands:
      - scrollUntilVisible:
          element:
            id: legal-consent-checkbox
          direction: DOWN
      - tapOn:
          id: legal-consent-checkbox
      - scrollUntilVisible:
          element:
            id: legal-consent-continue
          direction: DOWN
      - tapOn:
          id: legal-consent-continue
- runFlow:
    when:
      visible:
        id: screen-login
    commands:
      - tapOn:
          id: login-guest
      - runFlow:
          when:
            visible:
              id: guest-continue-button
          commands:
            - tapOn:
                id: guest-continue-button
      - runFlow:
          when:
            visible: "Continue as guest"
          commands:
            - tapOn: "Continue as guest"
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 45000
- tapOn:
    id: onboarding-diet-veg
- tapOn:
    id: onboarding-diet-continue
- extendedWaitUntil:
    visible:
      id: onboarding-cuisine-first
    timeout: 20000
- tapOn:
    id: onboarding-cuisine-first
- tapOn:
    id: onboarding-cuisine-continue
- tapOn:
    id: onboarding-skip-notify
- runFlow:
    when:
      visible:
        id: screen-login
    commands:
      - tapOn:
          id: login-guest
      - runFlow:
          when:
            visible:
              id: guest-continue-button
          commands:
            - tapOn:
                id: guest-continue-button
- runFlow:
    when:
      visible:
        id: login-guest
    commands:
      - tapOn:
          id: login-guest
      - runFlow:
          when:
            visible:
              id: guest-continue-button
          commands:
            - tapOn:
                id: guest-continue-button
      - runFlow:
          when:
            visible: "Continue as guest"
          commands:
            - tapOn: "Continue as guest"
- runFlow:
    file: _dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: screen-trial-welcome
    commands:
      - tapOn:
          id: trial-continue
- runFlow:
    file: _dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
- tapOn:
    id: tab-pantry
- assertVisible:
    id: screen-pantry
- tapOn:
    id: tab-saved
- assertVisible:
    id: screen-saved
- tapOn:
    id: tab-settings
- assertVisible:
    id: screen-settings
- tapOn:
    id: tab-home
- assertVisible:
    id: screen-home
