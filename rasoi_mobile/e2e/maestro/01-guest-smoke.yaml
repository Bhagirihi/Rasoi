# Guest smoke — legal → guest login → onboarding → all tabs
appId: com.bhagihiri.rasoiapp
---
- runFlow:
    file: _bootstrap.yaml
- tapOn:
    id: login-guest
- runFlow:
    when:
      visible:
        id: guest-continue-button
    commands:
      - tapOn:
          id: guest-continue-button
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
- runFlow:
    file: _onboarding.yaml
- tapOn:
    id: tab-pantry
- assertVisible:
    id: screen-pantry
- tapOn:
    id: tab-saved
- assertVisible:
    id: screen-saved
- tapOn:
    id: tab-settings
- assertVisible:
    id: screen-settings
- tapOn:
    id: tab-recipes
- assertVisible:
    id: screen-recipes-tab
- tapOn:
    id: tab-home
- assertVisible:
    id: screen-home
