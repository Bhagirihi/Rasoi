# Guest smoke — bootstrap → guest login (if needed) → onboarding gates → all tabs
appId: com.bhagihiri.rasoiapp
---
- runFlow:
    file: _bootstrap.yaml
- runFlow:
    when:
      visible:
        id: login-guest
    commands:
      - tapOn:
          id: login-guest
      - runFlow:
          when:
            visible:
              id: guest-continue-button
          commands:
            - tapOn:
                id: guest-continue-button
      - runFlow:
          when:
            visible: "Continue as guest"
          commands:
            - tapOn: "Continue as guest"
      - extendedWaitUntil:
          notVisible:
            text: "Opening Rasoi for you"
          timeout: 120000
          optional: true
- runFlow:
    file: _reach-home.yaml
- tapOn:
    id: tab-pantry
- assertVisible:
    id: screen-pantry
- tapOn:
    id: tab-saved
- assertVisible:
    id: screen-saved
- tapOn:
    id: tab-settings
- assertVisible:
    id: screen-settings
- tapOn:
    id: tab-recipes
- assertVisible:
    id: screen-recipes-tab
- tapOn:
    id: tab-home
- assertVisible:
    id: screen-home
