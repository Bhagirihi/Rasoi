# Theme toggle on Settings (requires logged-in session)
appId: com.rasoi.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn:
    id: tab-settings
- assertVisible:
    id: screen-settings
- tapOn:
    id: settings-theme-dark
- tapOn:
    id: settings-theme-light
- assertVisible:
    id: screen-settings
