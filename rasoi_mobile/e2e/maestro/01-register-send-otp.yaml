# TC-002: Register — fill details and send OTP (phone then email in 02-register-verify.yaml)
# Env: QA_NAME, QA_PHONE, QA_EMAIL, QA_PHONE_OTP (Firebase test number code)
appId: com.bhagihiri.rasoiapp
---
- runFlow:
    file: _bootstrap-to-login.yaml
- runFlow:
    when:
      visible:
        id: login-go-register
    commands:
      - tapOn:
          id: login-go-register
- runFlow:
    when:
      visible: "Create account"
    commands:
      - tapOn: "Create account"
- extendedWaitUntil:
    visible:
      id: screen-register
    timeout: 15000
- runFlow:
    when:
      visible:
        id: register-name-input
    commands:
      - tapOn:
          id: register-name-input
      - inputText: ${QA_NAME}
      - tapOn:
          id: register-phone-input
      - inputText: ${QA_PHONE}
      - tapOn:
          id: register-email-input
      - inputText: ${QA_EMAIL}
- runFlow:
    when:
      notVisible:
        id: register-name-input
    commands:
      - tapOn: "e.g. Priya Sharma"
      - inputText: ${QA_NAME}
      - tapOn: "9820174653"
      - inputText: ${QA_PHONE}
      - tapOn: "you@example.com"
      - inputText: ${QA_EMAIL}
- scroll
- runFlow:
    when:
      visible:
        id: onboarding-diet-veg
    commands:
      - tapOn:
          id: onboarding-diet-veg
- runFlow:
    when:
      visible: "Gujarati"
    commands:
      - tapOn: "Gujarati"
- runFlow:
    when:
      visible:
        id: onboarding-cuisine-first
    commands:
      - tapOn:
          id: onboarding-cuisine-first
- hideKeyboard
- tapOn:
    text: "Verify mobile number"
- runFlow:
    when:
      visible:
        id: register-terms-checkbox
    commands:
      - tapOn:
          id: register-terms-checkbox
      - tapOn:
          id: register-terms-continue
- runFlow:
    when:
      visible: "I have read and agree"
    commands:
      - tapOn: "I have read and agree"
      - tapOn: "Continue"
- extendedWaitUntil:
    visible:
      text: "Verify your mobile"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: register-phone-otp-input
    commands:
      - tapOn:
          id: register-phone-otp-input
      - eraseText
      - inputText: ${QA_PHONE_OTP}
- runFlow:
    when:
      notVisible:
        id: register-phone-otp-input
    commands:
      - tapOn: "123456"
      - eraseText
      - inputText: ${QA_PHONE_OTP}
- hideKeyboard
- tapOn:
    id: register-verify-phone-otp
- extendedWaitUntil:
    visible:
      text: "Verify your email"
    timeout: 90000
