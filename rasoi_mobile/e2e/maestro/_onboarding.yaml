# Complete onboarding: diet → cuisine → skip notifications → skip location → home
appId: com.bhagihiri.rasoiapp
---
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 45000
- tapOn:
    id: onboarding-diet-veg
- tapOn:
    id: onboarding-diet-continue
- extendedWaitUntil:
    visible:
      id: onboarding-cuisine-first
    timeout: 20000
- tapOn:
    id: onboarding-cuisine-first
- extendedWaitUntil:
    notVisible:
      text: "Pick at least one style"
    timeout: 15000
- tapOn:
    id: onboarding-cuisine-continue
- extendedWaitUntil:
    visible:
      id: onboarding-skip-notify
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: onboarding-skip-notify
    commands:
      - tapOn:
          id: onboarding-skip-notify
- extendedWaitUntil:
    visible:
      id: onboarding-skip-location
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: onboarding-skip-location
    commands:
      - tapOn:
          id: onboarding-skip-location
- runFlow:
    file: _dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: screen-trial-welcome
    commands:
      - tapOn:
          id: trial-continue
- runFlow:
    file: _dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
