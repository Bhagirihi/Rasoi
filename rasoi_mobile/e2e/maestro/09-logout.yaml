# TC-013: Logout returns to login
appId: com.bhagihiri.rasoiapp
---
- launchApp
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      text: "Log out"
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      visible:
        id: settings-logout
    commands:
      - tapOn:
          id: settings-logout
- runFlow:
    when:
      notVisible:
        id: settings-logout
    commands:
      - tapOn:
          text: "Log out"
          index: 0
- extendedWaitUntil:
    visible:
      text: "Log out?"
    timeout: 10000
- tapOn:
    text: "Log out"
    index: 1
- extendedWaitUntil:
    visible:
      id: screen-login
    timeout: 30000
